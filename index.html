<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="left-side">
            <div class="icon"><i class="fa-solid fa-utensils"></i></div>
            <div class="head">Foodie</div>
        </div>
        <div class="right-side">
            <div class="noti">2</div>
            <div class="icon"><i class="fa-solid fa-bag-shopping"></i></div>
    </nav>
    <div class="container">
        <div class="hero-sec">
            <div class="left">
                <div class="heading">Good food, <span>good mood''</span></div>
                <div class="des">Fresh, delicious & delivered fast to your door.</div>
                <div class="search"><input type="text" placeholder="Search for food, cuisine or resturant..."
                        id="input">
                    <div class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></div>
                </div>
            </div>
            <div class="right">
                <img src="images/ChatGPT Image Jul 1, 2026, 10_46_52 AM.png" alt="hero sec">
            </div>
        </div>
        <div class="category-container">
            <div class="category">
                <div class="head">Explore by category</div>
                <div class="category-opt">
                    <button class="category-btn active" id="all">All</button>
                    <button class="category-btn" id="breakfast">Breakfast</button>
                    <button class="category-btn" id="lunch">Lunch</button>
                    <button class="category-btn" id="dinner">Dinner</button>
                    <button class="category-btn" id="snack">Snack</button>
                    <button class="category-btn" id="drink">Beverage</button>
                    <button class="category-btn" id="Appetizer">Appetizer</button>
                    <button class="category-btn" id="dessert">Dessert</button>
                </div>
            </div>
            <section class="popular">

                <div class="popular-heading">
                    <h2>Popular Dishes</h2>

                    <a class="view-all">
                        View All
                        <span>➜</span>
                    </a>
                </div>

                <div class="popular-cards">



                </div>

            </section>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
